name: CI Build

on:
  push:
    branches: [ main, dev ]
  pull_request: # Good practice to also test PRs before merging
    branches: [ main, dev ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Required to push to the GitHub Container Registry

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        # Only login if it's a push/merge, skip if it's just a PR test
        if: github.event_name != 'pull_request' 
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          # Push to the registry only on direct pushes to main/dev, not on PRs
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository }}/grasp-system:latest
          # The magic sauce: Cache layers to speed up future builds!
          cache-from: type=gha
          cache-to: type=gha,mode=max