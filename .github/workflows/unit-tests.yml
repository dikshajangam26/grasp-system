name: Unit Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    runs-on: ubuntu-latest
    # Run the job inside a ROS 2 environment so dependencies like rclpy exist
    container:
      image: ros:humble-ros-base

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        # We must install the same system libraries our main Dockerfile uses
        run: |
          apt-get update
          apt-get install -y python3-pip python3-opencv ros-humble-cv-bridge

      - name: Install Python Dependencies & Test Tools
        run: |
          pip install --no-cache-dir -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Tests and Report Coverage
        # Source the ROS 2 environment, then run pytest on your tests directory
        run: |
          bash -c "source /opt/ros/humble/setup.bash && pytest ros2_ws/src/grasp_system/tests/ --cov=ros2_ws/src/grasp_system/grasp_system"