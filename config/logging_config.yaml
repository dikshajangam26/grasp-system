version: 1
formatters:
  simple:
    format: '[%(asctime)s] [%(name)s] [%(levelname)s] %(message)s'
handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: simple
  file:
    class: logging.FileHandler
    level: DEBUG
    filename: logs/grasp_system.log
    formatter: simple
loggers:
  vision_servo:
    level: DEBUG
    handlers: [console, file]
  grasp_predictor:
    level: DEBUG
    handlers: [console, file]
  ik_planner:
    level: DEBUG
    handlers: [console, file]